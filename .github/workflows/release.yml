name: Release - Build and Publish Package

on:
  push:
    tags:
      - "v*.*.*"   # runs only on tags like v0.1.0

env:
  UV_VERSION: "0.12.10"

jobs:
  check-tag-matches-version:
    name: Check tag matches package version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Set up uv
        uses: astral-sh/setup-uv@681c641aba71e4a1c380be3ab5e12ad51f415867  # v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Verify tag == pyproject version
        env:
          tag: ${{ github.ref_name }}
        run: |
          PKG_VERSION="$(uv version --short)"
          TAG_VERSION="${tag#v}"            # v0.1.0 -> 0.1.0
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $tag does not match pyproject.toml version $PKG_VERSION"
            exit 1
          fi
          echo "Tag $tag matches package version $PKG_VERSION"

  run-ci:
    name: Run CI Tests
    uses: ./.github/workflows/ci.yml

  build-and-publish:
    name: Build and Publish Package
    runs-on: ubuntu-latest
    needs: [ check-tag-matches-version, run-ci ]

    environment:
      name: pypi
    permissions:
      id-token: write    # PyPI Trusted Publishing (OIDC), no API token needed
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@681c641aba71e4a1c380be3ab5e12ad51f415867  # v7
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}

      - name: Build package (wheel and sdist)
        run: uv build

      - name: Publish to PyPI
        run: uv publish

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
        run: |
          gh release create "$tag" \
            --notes $'## Release Notes\nReleased on '"$(date -u +%Y-%m-%d)"$'\n\n' \
            --generate-notes

  build-app:
    name: Build murmur.dmg
    # Runs next to the PyPI job, not before it: a failed app build never blocks the package.
    # macos-15 is an Apple Silicon runner; the mlx wheel installed there is the macOS 15
    # build, so the app needs macOS 15 or newer (build_app.sh writes that into Info.plist).
    runs-on: macos-15
    needs: [ check-tag-matches-version, run-ci ]
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Set up uv
        uses: astral-sh/setup-uv@681c641aba71e4a1c380be3ab5e12ad51f415867  # v7
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}

      - name: Build murmur.app and the dmg
        run: ./scripts/build_app.sh

      - name: Upload the dmg for the release job
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5
        with:
          name: murmur-dmg
          path: dist/murmur-*-arm64.dmg
          if-no-files-found: error

  attach-dmg:
    name: Attach the dmg to the GitHub release
    # The release is created once, by build-and-publish. This job only uploads to it, and
    # only when both the package job and the app build succeeded.
    runs-on: ubuntu-latest
    needs: [ build-and-publish, build-app ]
    if: ${{ !cancelled() && needs.build-and-publish.result == 'success' && needs.build-app.result == 'success' }}
    permissions:
      contents: write

    steps:
      - name: Download the dmg
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0  # v5
        with:
          name: murmur-dmg

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          tag: ${{ github.ref_name }}
        run: |
          shasum -a 256 murmur-*-arm64.dmg > SHA256SUMS.txt
          gh release upload "$tag" murmur-*-arm64.dmg SHA256SUMS.txt --clobber
