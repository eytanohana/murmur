[project]
name = "murmur-dictation"
version = "0.2.0"
description = "Local push-to-talk dictation for macOS using Whisper large-v3-turbo on MLX"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eytan Ohana", email = "eohana98@gmail.com" }]
keywords = ["whisper", "dictation", "speech-to-text", "macos", "mlx"]
classifiers = [
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "mlx-whisper>=0.4.3",
    "numpy>=2.5.4",
    "pynput>=1.8.2",
    "pyobjc-framework-cocoa>=12.2.2",
    "pyobjc-framework-quartz>=12.2.2",
    "sounddevice>=0.5.6",
    "tomlkit>=0.15.2",
]

[project.urls]
Homepage = "https://github.com/eytanohana/murmur"
Repository = "https://github.com/eytanohana/murmur"

[project.scripts]
murmur = "murmur.__main__:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
build = [
    "dmgbuild>=1.6.7",
    "pyinstaller>=6.22.3",
]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.uv.build-backend]
module-name = "murmur"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
