[project]
name = "murmur"
version = "0.1.0"
description = "Local push-to-talk dictation for macOS using Whisper large-v3-turbo on MLX"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eytan Ohana", email = "eohana98@gmail.com" }]
keywords = ["whisper", "dictation", "speech-to-text", "macos", "mlx"]
classifiers = [
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "mlx-whisper>=0.4.3",
    "numpy>=2.5.4",
    "pynput>=1.8.2",
    "pyobjc-framework-cocoa>=12.2.2",
    "pyobjc-framework-quartz>=12.2.2",
    "sounddevice>=0.5.6",
]

[project.urls]
Homepage = "https://github.com/eytanohana/murmur"
Repository = "https://github.com/eytanohana/murmur"

[project.scripts]
murmur = "murmur.__main__:main"

[project.optional-dependencies]
menubar = [
    "rumps>=0.4.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
